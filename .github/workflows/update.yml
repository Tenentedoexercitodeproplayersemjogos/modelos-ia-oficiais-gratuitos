name: Atualizar lista

on:
  schedule:
    - cron: '0 6 * * 1'   # toda segunda, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-lista
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar lista não-texto (imagem, vídeo, áudio e voz)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/update_media.py

      - name: Gerar outros modelos (VLMs, embeddings, rerankers, edição e 3D)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/update_extras.py

      - name: Gerar lista a partir do Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/update_list.py

      - name: Commitar mudancas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md modelos.csv modelos.json midia.md midia.csv midia.json extras.md extras.csv extras.json
          if git diff --staged --quiet; then
            echo "Sem mudancas."
          else
            git commit -m "chore: atualiza lista de modelos"
            git push
          fi
